<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0a0a0f;
    font-family:Arial;
    color:white;
}

.login-card{
    width:350px;
    background:#1a1a24;
    padding:35px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,0.1);
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:6px;
    color:#999;
    font-size:14px;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#22222e;
    color:white;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#1a6ef5;
    color:white;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="login-card">

    <h1>Admin Access</h1>

    <form action="/admin-access" method="post">

        <div class="form-group">
            <label>Admin Username</label>
            <input type="text" name="username" required>
        </div>

        <div class="form-group">
            <label>Admin Password</label>
            <input type="password" name="password" required>
        </div>

        <button type="submit">
            Access Admin Panel
        </button>

    </form>

</div>

</body>
</html>
