<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel De Soleil Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
    --black:#07070c;
    --card:#1b1b26;
    --input:#242432;
    --blue:#1a6ef5;
    --blue-light:#3d8bff;
    --gold:#e8c97a;
    --gray:#9a9ab8;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at center, rgba(26,110,245,0.13), transparent 34%),
        linear-gradient(135deg, #07101f, #050506 70%);
    font-family:'Montserrat', sans-serif;
    color:white;
}

.login-card{
    width:445px;
    background:rgba(27,27,38,0.97);
    border:1px solid rgba(232,201,122,0.22);
    border-radius:18px;
    padding:45px 42px;
    box-shadow:0 35px 90px rgba(0,0,0,0.55);
}

.logo-wrap{
    text-align:center;
    margin-bottom:32px;
}

.logo-wrap img{
    width:92px;
    height:92px;
    object-fit:contain;
    border-radius:50%;
    margin-bottom:16px;
}

.logo-wrap h1{
    font-family:'Cormorant Garamond', serif;
    font-size:2rem;
    color:var(--gold);
    font-weight:600;
    letter-spacing:0.06em;
}

.logo-wrap p{
    color:#aaaacf;
    font-size:0.75rem;
    letter-spacing:0.28em;
    text-transform:uppercase;
    margin-top:7px;
}

.secure-line{
    display:flex;
    align-items:center;
    gap:12px;
    margin:28px 0 30px;
    color:#8f8fb0;
    font-size:0.76rem;
    letter-spacing:0.08em;
}

.secure-line::before,
.secure-line::after{
    content:"";
    height:1px;
    flex:1;
    background:rgba(255,255,255,0.1);
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    color:#aaaad0;
    font-size:0.76rem;
    font-weight:700;
    letter-spacing:0.12em;
    text-transform:uppercase;
    margin-bottom:8px;
}

.input-wrap{
    position:relative;
}

input{
    width:100%;
    padding:13px 44px 13px 14px;
    background:var(--input);
    color:white;
    border:1.5px solid rgba(255,255,255,0.12);
    border-radius:9px;
    outline:none;
    font-size:0.9rem;
}

input:focus{
    border-color:var(--blue-light);
    box-shadow:0 0 0 3px rgba(26,110,245,0.15);
}

.eye-icon{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    color:var(--gray);
    cursor:pointer;
}

.btn-login{
    width:100%;
    padding:15px;
    margin-top:12px;
    background:var(--blue);
    color:white;
    border:none;
    border-radius:10px;
    font-size:0.95rem;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 12px 30px rgba(26,110,245,0.28);
}

.btn-login:hover{
    background:var(--blue-light);
}
</style>
</head>

<body>

<div class="login-card">

    <div class="logo-wrap">
        <img src="/images/logo.jpg" alt="Hotel De Soleil Logo">
        <h1>Hotel De Soleil</h1>
        <p>Administrator Portal</p>
    </div>

    <div class="secure-line">Secure Admin Access</div>

    <form th:action="@{/admin-access}" method="post">

        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="Enter admin username" required>
        </div>

        <div class="form-group">
            <label>Password</label>

            <div class="input-wrap">
                <input type="password" id="adminPassword" name="password" placeholder="••••••••" required>

                <i class="fa-solid fa-eye eye-icon"
                   onclick="togglePassword('adminPassword', this)">
                </i>
            </div>
        </div>

        <button class="btn-login" type="submit">
            <i class="fa-solid fa-shield-halved"></i>
            Access Admin Panel
        </button>

    </form>

</div>

<script>
function togglePassword(inputId, icon){
    const input = document.getElementById(inputId);

    if(input.type === "password"){
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
    }else{
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
    }
}
</script>

</body>
</html>
